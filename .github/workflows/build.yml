name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish src/ZandronumWatcher.App -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ZandronumWatcher-win-x64
          path: publish
          retention-days: 14
